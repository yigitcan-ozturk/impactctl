name: External multi-service validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/validate-v0.2-external.sh'
      - 'docs/validation/V0.2_EXTERNAL_CANDIDATE.md'
      - '.github/workflows/external-multiservice-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Execute pinned external repository validation
        env:
          VALIDATION_OUT: ${{ runner.temp }}/impactctl-v02-validation
        run: bash scripts/validate-v0.2-external.sh
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impactctl-v02-external-validation
          path: ${{ runner.temp }}/impactctl-v02-validation/*.txt
          if-no-files-found: warn
      - name: Upload structured reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impactctl-v02-external-reports
          path: |
            ${{ runner.temp }}/impactctl-v02-validation/*.json
            ${{ runner.temp }}/impactctl-v02-validation/*.md
          if-no-files-found: warn
