name: Real Repo Validation

on:
  pull_request:
    paths:
      - 'scripts/validate-online-boutique.sh'
      - '.github/workflows/real-repo-validation.yml'
      - 'docs/validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online-boutique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build impactctl from this revision
        run: go build -o "$RUNNER_TEMP/impactctl" ./cmd/impactctl

      - name: Replay pinned Online Boutique change
        env:
          IMPACTCTL_BIN: ${{ runner.temp }}/impactctl
        run: bash scripts/validate-online-boutique.sh
